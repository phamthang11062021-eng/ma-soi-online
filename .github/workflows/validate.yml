name: Validate
on:
  push:
    branches: [main, feature/game-center-v3]
  pull_request:
    branches: [main, feature/game-center-v3]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/uno.js
      - run: node --check public/property.js
      - run: node --check public/roles.js
      - run: npm test
